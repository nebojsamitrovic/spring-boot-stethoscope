plugins {
    id 'java-library'
}

description = 'Stethoscope auto-configuration for Spring Boot'

dependencies {
    // Spring verzije dolaze iz BOM-a, ali ih ne nameće korisniku (compileOnly / optional).
    compileOnly platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    api project(':stethoscope-core')

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'org.slf4j:slf4j-api'
    compileOnly "net.ttddyy:datasource-proxy:${datasourceProxyVersion}"

    // Optional integrations: each watcher is @ConditionalOnClass on these.
    compileOnly 'org.springframework:spring-webflux'
    compileOnly 'org.springframework:spring-context-support'
    compileOnly 'jakarta.mail:jakarta.mail-api'
    compileOnly 'ch.qos.logback:logback-classic'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'org.hibernate.orm:hibernate-core'
    compileOnly 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.springframework.security:spring-security-core'
    compileOnly 'org.springframework.data:spring-data-redis'
    compileOnly 'org.springframework.kafka:spring-kafka'
    compileOnly 'org.springframework.amqp:spring-rabbit'

    // Generiše spring-configuration-metadata.json → autocomplete u application.yml
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "net.ttddyy:datasource-proxy:${datasourceProxyVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-mail'
    testImplementation 'org.springframework:spring-webflux'
    testImplementation 'io.projectreactor.netty:reactor-netty-http'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.data:spring-data-redis'
    testImplementation 'org.springframework.security:spring-security-core'
    testImplementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.amqp:spring-rabbit'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
