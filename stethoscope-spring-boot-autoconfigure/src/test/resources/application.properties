# No brokers in tests: the messaging watcher is covered by unit and ApplicationContextRunner tests.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
# Redis runs against a stub connection factory (see TestApplication); repositories would subscribe to keyspace events.
spring.data.redis.repositories.enabled=false
spring.jpa.open-in-view=false
