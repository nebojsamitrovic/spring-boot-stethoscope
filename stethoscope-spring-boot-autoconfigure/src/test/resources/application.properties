# No brokers in tests: the messaging watcher is covered by unit and ApplicationContextRunner tests.
# Spring Security is on the test classpath for LoginGateIntegrationTest only, which turns it back on.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# Redis runs against a stub connection factory (see TestApplication); repositories would subscribe to keyspace events.
spring.data.redis.repositories.enabled=false
spring.jpa.open-in-view=false
